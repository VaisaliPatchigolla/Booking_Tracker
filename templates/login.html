<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Travel Tracker</title>
    <link rel="stylesheet" href="/static/css/login.css">
</head>
<body style="background: linear-gradient(135deg, #6e8efb 0%, #a777e3 100%); min-height: 100vh;">
        <div class="login-card">
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        <div class="flash-messages">
                            {% set category, message = messages[-1] %}
                            <div class="flash-message flash-{{ category }}">{{ message }}</div>
                        </div>
                    {% endif %}
                {% endwith %}

        <div class="login-logo">
            <span class="plane-icon">✈️</span>
            <span class="brand-name">Travel Tracker</span>
        </div>

        <div class="login-title">Log In</div>

        <form id="login-form" method="POST" action="/login">
            <div class="input-group">
                <input type="text" id="login-username" name="username" required placeholder="Username or Email">
            </div>

            <div class="input-group">
                <input type="password" id="login-password" name="password" required placeholder="Password">
            </div>

            <button type="submit" class="login-btn">Log In</button>
        </form>

        <div class="signup-link">
            Don't have an account? <a href="/signup">Sign Up</a>
        </div>
    </div>
</body>
</html>
