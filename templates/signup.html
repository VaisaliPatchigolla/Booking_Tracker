<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Travel Tracker</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <style>
        .auth-container {
            max-width: 400px;
            margin: 4rem auto;
            background: linear-gradient(135deg, #e0e7ff 0%, #f8fafc 100%);
            border-radius: 18px;
            box-shadow: 0 4px 24px rgba(80, 80, 180, 0.08);
            padding: 2.5rem 2rem 2rem 2rem;
        }
        .auth-title {
            text-align: center;
            font-size: 2rem;
            font-weight: 600;
            color: #3b3b5c;
            margin-bottom: 2rem;
        }
        .auth-link {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            color: #6366f1;
            text-decoration: none;
            font-weight: 500;
        }
        .auth-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <body style="background: linear-gradient(135deg, #6e8efb 0%, #a777e3 100%); min-height: 100vh;">
        <div class="login-card">
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        <div class="flash-messages">
                            {% set category, message = messages[-1] %}
                            <div class="flash-message flash-{{ category }}">{{ message }}</div>
                        </div>
                    {% endif %}
                {% endwith %}
            <style>
            .flash-messages {
                width: 100%;
                margin-bottom: 1.2rem;
                display: flex;
                justify-content: center;
            }
            .flash-message {
                padding: 0.9rem 1.2rem;
                border-radius: 14px;
                font-size: 1.08rem;
                text-align: center;
                font-weight: 600;
                min-width: 220px;
                box-shadow: 0 2px 8px rgba(110, 142, 251, 0.07);
            }
            .flash-success {
                background: #e8f5e9;
                color: #388e3c;
                border-left: 5px solid #388e3c;
            }
            .flash-error {
                background: #ffebee;
                color: #d32f2f;
                border-left: 5px solid #d32f2f;
            }
            </style>
        <div class="login-logo">
            <span class="plane-icon">✈️</span>
            <span class="brand-name">Travel Tracker</span>
        </div>
        <div class="login-title">Sign Up</div>
        <form id="signup-form" method="POST" action="/signup">
            <div class="input-group">
                <input type="text" id="signup-username" name="username" required placeholder="Username">
            </div>
            <div class="input-group">
                <input type="email" id="signup-email" name="email" required placeholder="Email">
            </div>
            <div class="input-group">
                <input type="password" id="signup-password" name="password" required placeholder="Password">
            </div>
            <button type="submit" class="login-btn">Sign Up</button>
        </form>
        <div class="signup-link">
            Already have an account? <a href="/login">Log In</a>
        </div>
    </div>
    <style>
    body {
        background: linear-gradient(135deg, #6e8efb 0%, #a777e3 100%);
        min-height: 100vh;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .login-card {
        max-width: 370px;
        margin: 5% auto;
        background: rgba(255,255,255,0.95);
        border-radius: 28px;
        box-shadow: 0 8px 32px rgba(80, 80, 180, 0.18);
        padding: 2.5rem 2rem 2rem 2rem;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    .login-logo {
        display: flex;
        align-items: center;
        margin-bottom: 1.2rem;
    }
    .plane-icon {
        font-size: 2.2rem;
        margin-right: 0.5rem;
    }
    .brand-name {
        font-size: 1.6rem;
        font-weight: bold;
        color: #6e8efb;
        letter-spacing: 1px;
    }
    .login-title {
        font-size: 1.3rem;
        font-weight: 600;
        color: #3b3b5c;
        margin-bottom: 1.5rem;
        letter-spacing: 0.5px;
    }
    .input-group {
        width: 100%;
        margin-bottom: 1.2rem;
    }
    .input-group input {
        width: 100%;
        padding: 0.9rem 1.1rem;
        border: none;
        border-radius: 14px;
        background: #f3f6fd;
        font-size: 1rem;
        color: #333;
        box-shadow: 0 2px 8px rgba(110, 142, 251, 0.07);
        outline: none;
        transition: box-shadow 0.2s;
    }
    .input-group input:focus {
        box-shadow: 0 4px 16px rgba(110, 142, 251, 0.15);
        background: #eaf0ff;
    }
    .login-btn {
        width: 100%;
        padding: 0.9rem 0;
        border: none;
        border-radius: 14px;
        background: linear-gradient(90deg, #6e8efb 0%, #a777e3 100%);
        color: #fff;
        font-size: 1.1rem;
        font-weight: 600;
        cursor: pointer;
        margin-bottom: 1.2rem;
        box-shadow: 0 2px 8px rgba(110, 142, 251, 0.13);
        transition: background 0.2s;
    }
    .login-btn:hover {
        background: linear-gradient(90deg, #5a7cfb 0%, #8e5ee3 100%);
    }
    .signup-link {
        text-align: center;
        color: #6e8efb;
        font-size: 1rem;
    }
    .signup-link a {
        color: #a777e3;
        font-weight: 600;
        text-decoration: none;
        margin-left: 0.2em;
    }
    .signup-link a:hover {
        text-decoration: underline;
    }
    </style>
    </body>
</body>
</html>
