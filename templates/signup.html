<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Travel Tracker</title>
    <link rel="stylesheet" href="/static/css/signp.css">
</head>
<body>
    <body style="background: linear-gradient(135deg, #6e8efb 0%, #a777e3 100%); min-height: 100vh;">
        <div class="login-card">
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        <div class="flash-messages">
                            {% set category, message = messages[-1] %}
                            <div class="flash-message flash-{{ category }}">{{ message }}</div>
                        </div>
                    {% endif %}
                {% endwith %}

        <div class="login-logo">
            <span class="plane-icon">✈️</span>
            <span class="brand-name">Travel Tracker</span>
        </div>

        <div class="login-title">Sign Up</div>

        <form id="signup-form" method="POST" action="/signup">
            <div class="input-group">
                <input type="text" id="signup-username" name="username" required placeholder="Username">
            </div>

            <div class="input-group">
                <input type="email" id="signup-email" name="email" required placeholder="Email">
            </div>

            <div class="input-group">
                <input type="password" id="signup-password" name="password" required placeholder="Password">
            </div>

            <button type="submit" class="login-btn">Sign Up</button>
        </form>

        <div class="signup-link">
            Already have an account? <a href="/login">Log In</a>
        </div>
    </div>
    </body>
</body>
</html>
