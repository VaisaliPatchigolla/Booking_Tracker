<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Travel Tracker</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <header>
        <nav>
            <a href="/" class="logo">✈️ Travel Tracker</a>
            <ul class="nav-links">
                <li><a href="/">Dashboard</a></li>
                <li><a href="/add">Add Travel</a></li>
                <li><a href="/logout" id="logout-link">Logout</a></li>
            </ul>
        </nav>
    </header>

    <div id="message-container"></div>

    <main>
        <h1 class="page-title">My Travel Adventures</h1>

        <!-- Statistics Dashboard -->
        <div class="stats-grid" id="stats-container">
            <div class="stat-card">
                <div class="stat-label">Loading...</div>
                <div class="stat-value">-</div>
            </div>
        </div>

                <!-- Travel Management Panel (Updated Filter Section) -->
                <div class="travel-panel-container">
                    <h2 class="travel-panel-title">Travel Management Panel</h2>
                    <div class="travel-panel-filters">
                        <div class="travel-panel-row">
                            <div class="travel-panel-group">
                                <label for="status-filter">Status</label>
                                <select id="status-filter" class="travel-panel-input">
                                    <option value="">All Status</option>
                                    <option value="upcoming">Upcoming</option>
                                    <option value="ongoing">Ongoing</option>
                                    <option value="completed">Completed</option>
                                </select>
                            </div>
                            <div class="travel-panel-group">
                                <label for="sort-by">Sort By</label>
                                <select id="sort-by" class="travel-panel-input">
                                    <option value="travel-date">Travel Date</option>
                                    <option value="from-location">From Location</option>
                                    <option value="to-location">To Location</option>
                                    <option value="budget">Expense Spent / Budget</option>
                                    <option value="created_at">Recently Added</option>
                                </select>
                            </div>
                            <div class="travel-panel-group search-group">
                                <label for="search-input">Search</label>
                                <input type="text" id="search-input" class="travel-panel-input" placeholder="Search destination or notes...">
                            </div>
                            <div class="travel-panel-group button-group">
                                <button id="search-btn" class="travel-panel-btn search-btn"><span class="icon"></span> Search</button>
                                <button id="reset-filters" class="travel-panel-btn reset-btn" type="button">Reset</button>
                            </div>
                        </div>
                    </div>
                </div>

        <!-- Travels Container -->
        <div id="travels-container" class="travels-container">
            <div class="empty-state">
                <div class="empty-state-icon">⏳</div>
                <h3>Loading trips...</h3>
            </div>
        </div>
    </main>

    <script src="/static/js/script.js"></script>
</body>
</html>
